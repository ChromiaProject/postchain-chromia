image: registry.gitlab.com/chromaway/core-tools/chromia-images/maven-docker-java21:1.0.6@sha256:089097e3a81f53e3c707847579228bfc466a1eb826f8fd1a1b885b99d62e8c36
include:
  - project: "chromaway/core-infra/gitlab-automation"
    ref: 1.3.0
    file:
      - templates/release.yml
      - templates/maven-dependency-scanning.yml
      - templates/container-dependency-scanning.yml
#      - templates/report-code-coverage.yml

.setup:
  tags:
    - saas-linux-large-amd64
  before_script:
    - docker run
      --detach
      --name postgres
      --env POSTGRES_PASSWORD=postchain
      --env POSTGRES_USER=postchain
      --env PGDATA=/pgtmpfs
      --tmpfs=/pgtmpfs:size=1000m
      --publish 5432:5432
      postgres:16.6-alpine3.21@sha256:aba1fab94626cf8b0f4549055214239a37e0a690f03f142b7bca05b9ed36c6db
    - export POSTCHAIN_TEST_MASTER_HOST=$(hostname -I | awk '{print $1}') # Finds the IP of the build job container
    - mkdir -p $TEST_MOUNT_DIRECTORY
  # Necessary to be able to launch PostgreSQL in Docker manually. PostgreSQL is
  # launched in Docker manually (and not as a service, here) because then we can
  # use a tmpfs (in-memory disk) for the data, making it faster.
  services:
    - name: docker:28.2.2-dind
      alias: docker
      command: [ "--tls=false" , "--experimental" ]
  artifacts:
    when: always
    paths:
      - "**/*.log"
      - $JACOCO_REPORT_DIR/*
    reports:
      junit:
        - "**/target/surefire-reports/TEST-*.xml"
        - "**/target/failsafe-reports/TEST-*.xml"
        - "**/target/rell-reports/rell-tests.xml"
    expire_in: 1 week

stages:
  - build
  - code-coverage
  - slow-integration-tests
  - deploy
  - dependency-check
  - release

# Triggered by that something was merged into or pushed onto main
deploy-snapshot:
  extends: .setup
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
  script:
    - git fetch --unshallow
    - git fetch --tags
    - CURRENT_VERSION=$(git describe --tags --abbrev=0)
    - IFS=. read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
    - SNAPSHOT_VERSION=$MAJOR.$((MINOR + 1)).0-SNAPSHOT
    - mvn
      $MAVEN_CLI_OPTS
      --activate-profiles ci,slow-it,docker-push,distro
      -Drevision=$SNAPSHOT_VERSION
      -Djib.to.tags=latest-snapshot
      clean source:jar deploy

# Triggered by that a semver tag was pushed
deploy:
  extends: .setup
  stage: deploy
  rules:
    - if: $CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+$/
  script:
    - mvn
      $MAVEN_CLI_OPTS
      --activate-profiles ci,slow-it,docker-push,distro
      -Drevision=$CI_COMMIT_TAG
      clean source:jar deploy

build:
  extends:
    - .setup
#    - .visualise-test-coverage
  stage: build
  interruptible: true
  except:
    refs:
      - dev
      - tags
  script: # TODO revert
    - echo mvn
      $MAVEN_CLI_OPTS
      --activate-profiles ci,coverage
      verify

gitlab-release:
  extends: .gitlab-release-with-notes
  script:
    - |
      if [ -z "$SKIP_SUB_CHANGELOG" ]; then
  
        echo "Appending sub changelogs..."
      
        git fetch --tags --force &> /dev/null
        PREV_CI_COMMIT_TAG=$(git for-each-ref --sort=-creatordate --format '%(refname:short)' refs/tags | grep $CI_COMMIT_TAG -A1 | tail -n 1)
        echo "Previous tag: $PREV_CI_COMMIT_TAG"
        
        function get_pom_diff_version {
          echo "$1" | grep "^${2}[ ]*<${3}>[0-9.]*</${3}>$" | egrep -o '[0-9]{1,}[.][0-9]{1,}[.][0-9]{1,}' || echo ""
        }
        
        function include_dependency_changelog {
          tag_from="$1"
          tag_to="$2"
          name="$3"
          pom_variable="$4"
          gl_project_id="$5"
        
          pom_diff="$(git --no-pager diff ${tag_from}..${tag_to} -- pom.xml)"
          dependency_from_version="$(get_pom_diff_version "$pom_diff" "-" "$pom_variable")"
          dependency_to_version="$(get_pom_diff_version "$pom_diff" "+" "$pom_variable")"
        
          if [ -n "$dependency_from_version" ] && [ "$dependency_from_version" != "$dependency_to_version" ]; then
        
              echo "Fetching dependency $name changelog from $dependency_from_version to $dependency_to_version"
              wget --header="PRIVATE-TOKEN: $CI_API_TOKEN" -O- "$CI_API_V4_URL/projects/$gl_project_id/repository/changelog?version=9999.9999.9999&from=${dependency_from_version}&to=${dependency_to_version}" | grep -o "\"notes\":\"[^\"]*\"" | sed "s/\"notes\":\"//;s/\"$//;" | sed "s/\\\\n/\n/g" | sed "s/##.*/#### Includes updated $name ($dependency_from_version - $dependency_to_version)/g" >> release_notes.md
          fi
        }
        include_dependency_changelog $PREV_CI_COMMIT_TAG $CI_COMMIT_TAG "Postchain" "postchain.version" 32294340
        include_dependency_changelog $PREV_CI_COMMIT_TAG $CI_COMMIT_TAG "EIF" "eif.version" 36768178
        
        cat release_notes.md
      else
        echo "Skipping sub changelogs"
      fi
  release:
    name: 'Postchain Chromia $CI_COMMIT_TAG'
    description: release_notes.md
    tag_name: '$CI_COMMIT_TAG'

