definitions:
  common_config: &common_config
    features:
      merkle_hash_version: 2
    blockstrategy:
      name: net.postchain.devtools.OnDemandBlockBuildingStrategy
    configurationfactory: NOT_USED
    signers:
      - x"03a301697bdfcd704313ba48e51d567543f2a182031efd6915ddc07bbcc4e16070"
      - x"031B84C5567B126440995D3ED5AABA0565D71E1834604819FF9C17F5E9D5DD078F"
      - x"03B2EF623E7EC933C478135D1763853CBB91FC31BA909AEC1411CA253FDCC1AC94"
      - x"0203C6150397F7E4197FF784A8D74357EF20DAF1D09D823FFF8D3FC9150CBAE85D"

blockchains:
  system_anchoring:
    module: anchoring_chain_system
    config:
      <<: *common_config
      gtx:
        modules:
          - "net.postchain.d1.anchoring.system.SystemAnchoringGTXModule"
          - "net.postchain.d1.anchoring.SystemAnchoringIcmfSenderTestGTXModule"
  cluster_anchoring:
    module: anchoring_chain_cluster
    config:
      <<: *common_config
      gtx:
        modules:
          - "net.postchain.d1.anchoring.cluster.ClusterAnchoringGTXModule"
  cluster_anchoring_batch:
    module: anchoring_chain_cluster
    config:
      <<: *common_config
      anchoring:
        batch_mode: true
      gtx:
        modules:
          - "net.postchain.d1.anchoring.cluster.ClusterAnchoringGTXModule"
  cluster_anchoring_max_blocks_per_chain:
    module: anchoring_chain_cluster
    config:
      <<: *common_config
      anchoring:
        max_blocks_per_chain: 3
      gtx:
        modules:
          - "net.postchain.d1.anchoring.cluster.ClusterAnchoringGTXModule"
  cluster_anchoring_limit_size:
    module: anchoring_chain_cluster
    config:
      <<: *common_config
      blockstrategy:
        name: net.postchain.devtools.OnDemandBlockBuildingStrategy
        maxblocksize: 120000
      gtx:
        modules:
          - "net.postchain.d1.anchoring.cluster.ClusterAnchoringGTXModule"
  cluster_anchoring_limit_size_on_tx:
    module: anchoring_chain_cluster
    config:
      <<: *common_config
      gtx:
        max_transaction_size: 120000
        modules:
          - "net.postchain.d1.anchoring.cluster.ClusterAnchoringGTXModule"
