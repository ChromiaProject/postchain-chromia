definitions:
  - &common_ft4_args
    lib.ft4.core.accounts:
      rate_limit:
        active: true
        max_points: 200
        recovery_time: 5000
        points_at_account_creation: 100
    lib.ft4.core.auth:
      evm_signatures_authorized_operations:
        - eif.hbridge.link_evm_eoa_account
    lib.ft4.core.accounts.strategies.transfer:
      rules:
        - sender_blockchain:
            - "*"
          sender: "*"
          recipient: "*"
          asset: "*"
          timeout_days: 10
          strategy: "open"
    lib.ft4.core.admin:
      admin_pubkey: 03A301697BDFCD704313BA48E51D567543F2A182031EFD6915DDC07BBCC4E16070 # key0
    lib.access.admin:
      admin_pubkey: 03A301697BDFCD704313BA48E51D567543F2A182031EFD6915DDC07BBCC4E16070 # key0

blockchains:
  test_dapp:
    module: test_dapp
    config:
      features:
        merkle_hash_version: 2
      blockstrategy:
        maxblocktime: 1000
        maxblocktransactions: 500
      gtx:
        modules:
          - net.postchain.d1.icmf.IcmfSenderGTXModule
    moduleArgs:
      main:
        admin: x'030AB2EA43A545578C8BA13E0A6948E3A120E9C1AF87B9F864CCB469529CF4F653'

  test_dapp2:
    module: test_dapp2
    config:
      features:
        merkle_hash_version: 2
      blockstrategy:
        maxblocktime: 2000
        maxblocktransactions: 500
      gtx:
        modules:
          - net.postchain.d1.icmf.IcmfReceiverGTXModule
          - net.postchain.d1.iccf.IccfGTXModule
      sync_ext:
        - net.postchain.d1.icmf.IcmfReceiverSynchronizationInfrastructureExtension
      icmf:
        receiver:
          local:
            - bc-rid: ICMF_SENDER_BRID
              topic: L_city
    moduleArgs:
      main:
        admin: x'030AB2EA43A545578C8BA13E0A6948E3A120E9C1AF87B9F864CCB469529CF4F653'

  test_dapp3:
    module: test_dapp3
    config:
      features:
        merkle_hash_version: 2
      blockstrategy:
        maxblocktime: 2000
        maxblocktransactions: 500
      gtx:
        modules:
          - net.postchain.d1.icmf.IcmfSenderGTXModule
    moduleArgs:
      main:
        admin: x'030AB2EA43A545578C8BA13E0A6948E3A120E9C1AF87B9F864CCB469529CF4F653'

  test_dapp5:
    module: test_dapp5
    config:
      features:
        merkle_hash_version: 2
      blockstrategy:
        maxblocktime: 2001
        maxblocktransactions: 501
      gtx:
        modules:
          - net.postchain.d1.icmf.IcmfSenderGTXModule
    moduleArgs:
      main:
        admin: x'030AB2EA43A545578C8BA13E0A6948E3A120E9C1AF87B9F864CCB469529CF4F653'

  test_crosschain_transfer:
    module: test_crosschain_transfer
    config:
      features:
        merkle_hash_version: 2
      blockstrategy:
        maxblocktime: 1000
      gtx:
        modules:
          - "net.postchain.d1.iccf.IccfGTXModule"

  test_token_chain_account_creation:
    module: test_token_chain_account_creation
    config:
      features:
        merkle_hash_version: 2

  test_crosschain_massexit_bridge:
    module: test_crosschain_massexit.bridge
    config:
      features:
        merkle_hash_version: 2
      blockstrategy:
        maxblocktime: 1000
      eif:
        # event receiver
        chains:
          ethereum:
            network_id: 1337
            skip_to_height: 0
            evm_read_offset: 0
            read_offset: 0
            events: !include events.yml
        # event processing
        snapshot:
          levels_per_page: 2
          snapshots_to_keep: 2
          version: 2
      gtx:
        modules:
          - "net.postchain.d1.iccf.IccfGTXModule"
          - "net.postchain.eif.EifGTXModule"
      sync_ext:
        - "net.postchain.eif.EifSynchronizationInfrastructureExtension"
    moduleArgs:
      <<: *common_ft4_args
      lib.eif_event_receiver:
        enable_icmf: false
      lib.hbridge:
        version: 2

  test_crosschain_massexit_dapp:
    module: test_crosschain_massexit.dapp
    config:
      features:
        merkle_hash_version: 2
      blockstrategy:
        maxblocktime: 1000
      eif:
        # event processing
        snapshot:
          levels_per_page: 2
          snapshots_to_keep: 2
          version: 2
      gtx:
        modules:
          - "net.postchain.d1.iccf.IccfGTXModule"
          - "net.postchain.eif.EifGTXModule"
    moduleArgs:
      <<: *common_ft4_args
      lib.hbridge:
        version: 2

