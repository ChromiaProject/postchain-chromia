include=private.properties

configuration.provider.node=managed
infrastructure=net.postchain.d1.D1MasterInfrastructureFactory

database.driverclass=org.postgresql.Driver
database.username=postchain
database.password=postchain
database.schema=mme_d1_node2

api.port=7741
fastsync.exit_delay=2000

messaging.port=9872

container.docker-image=chromaway/chromia-subnode:latest
container.host-mount-dir=/tmp/chromaway/postchain
container.host-mount-device=/dev/loop0
container.master-port=9875
container.subnode-database-url=jdbc:postgresql://localhost:5432/postchain