definitions:
  common.init: &common_init
    initial_provider: x"03ECD350EEBC617CBBFBEF0A1B7AE553A748021FD65C7C50C5ABB4CA16D4EA5B05"
    genesis_node:
      - x"0350fe40766bc0ce8d08b3f5b810e49a8352fdd458606bd5fafe5acdcdc8ff3f57"
      - node1
      - 9871
      - "http://node1:7740"
      - ""

blockchains:
  manager:
    module: management_chain_devnet1
    moduleArgs:
      common:
        allow_blockchain_dependencies: false
        provider_quota_max_actions_per_day: 100
      common.init: *common_init
      common.queries:
        developers:
          - andrei.ursu@chromaway.com
          - eugene.tykulov@chromaway.com
          - johan.nilsson@chromaway.com
          - mikael.staldal@chromaway.com
          - robert.wideberg@chromaway.com
      proposal_blockchain_move:
        provider_quota_move_cost: 5
      proposal_blockchain.util:
        max_config_path_depth: 10
        max_config_size: 2097152 # 2 MiB
        max_block_size: 27262976
        min_inter_block_interval: 1000
        min_fast_revolt_status_timeout: 2000
        allowed_dapp_chain_gtx_modules:
          - "net.postchain.rell.module.RellPostchainModuleFactory"
          - "net.postchain.gtx.StandardOpsGTXModule"
          - "net.postchain.d1.icmf.IcmfSenderGTXModule"
          - "net.postchain.d1.icmf.IcmfReceiverGTXModule"
          - "net.postchain.d1.iccf.IccfGTXModule"
          - "net.postchain.eif.EifGTXModule"
        allowed_dapp_chain_sync_exts:
          - "net.postchain.d1.icmf.IcmfReceiverSynchronizationInfrastructureExtension"
          - "net.postchain.eif.EifSynchronizationInfrastructureExtension"
        allowed_blockchain_features:
          - "merkle_hash_version"
        required_blockchain_features: [ ]
        require_min_merkle_hash_version: 2
        allowed_dapp_chain_native_functions:
          - "net.postchain.d1.BlockWitnessRellNative"
      auth_service:
        pubkey: x"02B6F2967CF9AFC4D289EF475A2C2DDEC9EAB79AC60C1C99683E3134074619E635"
        include_system_cluster: true
      housekeeping:
        max_empty_container_time: 259200000 # 3 days
      node_software_version:
        node_image:
          url: registry.gitlab.com/chromaway/postchain-chromia/chromaway/chromia-server
          tag: 0.0.0
          digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        default_subnode_image:
          url: registry.gitlab.com/chromaway/postchain-chromia/chromaway/chromia-subnode
          tag: 0.0.0
          digest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    config:
      signers:
        - x"0350fe40766bc0ce8d08b3f5b810e49a8352fdd458606bd5fafe5acdcdc8ff3f57"
      features:
        merkle_hash_version: 2
      config_consensus_strategy: HEADER_HASH
      fast_revolt_status_timeout: 2000
      blockstrategy:
        maxblocktime: 2000
      sync_ext:
        - net.postchain.d1.icmf.IcmfReceiverSynchronizationInfrastructureExtension
      gtx:
        modules:
          - "net.postchain.d1.icmf.IcmfReceiverGTXModule"
          - "net.postchain.d1.icmf.IcmfSenderGTXModule"
          - "net.postchain.eif.transaction.signerupdate.directorychain.SignerUpdateGTXModule"
      icmf:
        receiver:
          anchoring:
            topics:
              - G_configuration_updated
              - G_configuration_failed
  system_anchoring:
    module: anchoring_chain_system
    config:
      features:
        merkle_hash_version: 2
      config_consensus_strategy: HEADER_HASH
      blockstrategy:
        maxblocktime: 2000
        maxblocktransactions: 500
      gtx:
        modules:
          - "net.postchain.d1.anchoring.system.SystemAnchoringGTXModule"
          - "net.postchain.d1.icmf.IcmfSenderGTXModule"
  cluster_anchoring:
    module: anchoring_chain_cluster
    config:
      features:
        merkle_hash_version: 2
      config_consensus_strategy: HEADER_HASH
      blockstrategy:
        maxblocktime: 2000
        maxblocktransactions: 500
      sync_ext:
        - "net.postchain.d1.icmf.IcmfReceiverSynchronizationInfrastructureExtension"
      gtx:
        modules:
          - "net.postchain.d1.anchoring.cluster.ClusterAnchoringGTXModule"
          - "net.postchain.d1.icmf.IcmfSenderGTXModule"
          - "net.postchain.d1.icmf.IcmfReceiverGTXModule"
      icmf:
        receiver:
          global:
            topics:
              - G_create_cluster_v2
              - G_create_container
              - G_upgrade_container
              - G_stop_container
              - G_restart_container
              - G_register_dapp_provider
  mainnet:
    module: management_chain_mainnet
    config:
      features:
        merkle_hash_version: 2
      config_consensus_strategy: HEADER_HASH
      blockstrategy:
        maxblocktime: 2000
      revolt:
        fast_revolt_status_timeout: 2000
      signers:
        - x"0350fe40766bc0ce8d08b3f5b810e49a8352fdd458606bd5fafe5acdcdc8ff3f57"
      sync_ext:
        - "net.postchain.d1.icmf.IcmfReceiverSynchronizationInfrastructureExtension"
      gtx:
        modules:
          - "net.postchain.d1.icmf.IcmfSenderGTXModule"
          - "net.postchain.d1.icmf.IcmfReceiverGTXModule"
          - "net.postchain.eif.transaction.signerupdate.directorychain.SignerUpdateGTXModule"
      icmf:
        receiver:
          anchoring:
            topics:
              - G_configuration_updated
              - G_configuration_failed
          global:
            topics:
              - G_create_cluster_v2
              - G_create_container
              - G_upgrade_container
              - G_stop_container
              - G_restart_container
              - G_register_dapp_provider
    moduleArgs:
      common:
        allow_blockchain_dependencies: false
        provider_quota_max_actions_per_day: 100
      common.init: *common_init
      common.queries:
        developers:
          - andrei.ursu@chromaway.com
          - eugene.tykulov@chromaway.com
          - johan.nilsson@chromaway.com
          - mikael.staldal@chromaway.com
          - robert.wideberg@chromaway.com
      proposal_blockchain_move:
        provider_quota_move_cost: 35
      proposal_blockchain.util:
        max_config_path_depth: 10
        max_config_size: 2097152 # 2 MiB
        max_block_size: 27262976
        min_inter_block_interval: 1000
        min_fast_revolt_status_timeout: 2000
        allowed_dapp_chain_gtx_modules:
          - "net.postchain.rell.module.RellPostchainModuleFactory"
          - "net.postchain.gtx.StandardOpsGTXModule"
          - "net.postchain.d1.icmf.IcmfSenderGTXModule"
          - "net.postchain.d1.icmf.IcmfReceiverGTXModule"
          - "net.postchain.d1.iccf.IccfGTXModule"
          - "net.postchain.eif.EifGTXModule"
        allowed_dapp_chain_sync_exts:
          - "net.postchain.d1.icmf.IcmfReceiverSynchronizationInfrastructureExtension"
          - "net.postchain.eif.EifSynchronizationInfrastructureExtension"
        allowed_blockchain_features:
          - "merkle_hash_version"
        required_blockchain_features: []
        require_min_merkle_hash_version: 2
        allowed_dapp_chain_native_functions:
          - "net.postchain.d1.BlockWitnessRellNative"
      node_software_version:
        node_image:
          url: registry.gitlab.com/chromaway/postchain-chromia/chromaway/chromia-server
          tag: 0.0.0
          digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        default_subnode_image:
          url: registry.gitlab.com/chromaway/postchain-chromia/chromaway/chromia-subnode
          tag: 0.0.0
          digest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
  economy_chain:
    module: economy_chain_test
    config:
      features:
        merkle_hash_version: 2
      config_consensus_strategy: HEADER_HASH
      blockstrategy:
        maxblocktime: 2000
      revolt:
        fast_revolt_status_timeout: 2000
      sync_ext:
        - "net.postchain.d1.icmf.IcmfReceiverSynchronizationInfrastructureExtension"
      gtx:
        modules:
          - "net.postchain.d1.icmf.IcmfReceiverGTXModule"
          - "net.postchain.d1.icmf.IcmfSenderGTXModule"
          - "net.postchain.eif.EifGTXModule"
          - "net.postchain.d1.iccf.IccfGTXModule"
      icmf:
        receiver:
          anchoring:
            topics:
              - G_node_availability_report
          directory-chain:
            topics:
              - L_create_cluster_error
              - L_ticket_container_result
              - L_cluster_update
              - L_provider_update
              - L_node_update
              - L_cluster_node_update
          local:
            - topic: L_evm_block_events
              bc-rid: EIF_EC_EVENT_RECEIVER_BRID_PLACEHOLDER
    moduleArgs:
      lib.hbridge:
        version: 2 # Not true on mainnet but deploying the old contract here is probably too much hassle since it's on a separate branch
      lib.ft4.core.admin:
        admin_pubkey: 0317AC5B309A05B81A68F1A64321A3C6E6799E037C12892838682EBB9A620316A6
      lib.ft4.core.accounts:
        rate_limit:
          active: 1
          max_points: 20
          recovery_time: 5000
          points_at_account_creation: 1
      lib.ft4.core.auth:
        evm_signatures_authorized_operations:
          - eif.hbridge.link_evm_eoa_account
      lib.ft4.core.accounts.strategies.transfer:
        rules:
          - sender_blockchain:
              - "EIF_EC_STRATEGY_SENDER_BLOCKCHAIN" # chr repl -c '("EVM",1,x"token_address_without_0x").hash()'
            sender: "*"
            recipient: "*"
            asset:
              - name: "tCHR" # Should match `economy_chain_module_args.asset_name`
                min_amount: 10000000L # 10.0 CHR
            timeout_days: 10
            strategy: "open"
          - sender_blockchain: "$"
            sender: "*"
            recipient: "*"
            asset:
              - name: "tCHR" # Should match `economy_chain_module_args.asset_name`
                min_amount: 10000000L # 10.0 CHR
            timeout_days: 10
            strategy: "fee"
      lib.ft4.core.accounts.strategies.transfer.fee:
        asset:
          - name: "tCHR"  # Should match `economy_chain_module_args.asset_name`
            amount: 10000000L # 10.0 CHR
        fee_account: x"A97CEAF65C5D7BE1B1307B0CD11AC9B3DB7065D24B8C1D36B135C68A846A4426" # pool account
      economy_chain:
        evm_bridges:
          - network_id: 11155111
            asset_address: "Aa1ae68ABcd32804132370B9f73c3160dbbfC593"
            bridge_address: "B2ee8499B5e73795F28287A0603d66db6843AAAA"
            skip_to_height: 0
        asset_name: "tCHR"
        asset_symbol: "tCHR"
        asset_decimals: 6
        asset_icon: "https://s3.eu-central-1.amazonaws.com/www.chromiadev.net/assets/tCHR.png"
        pool_amount_to_mint: 1000000000
        staking_withdrawal_delay_ms: 1209600000
        staking_delegation_delay_ms: 604800000
        staking_rewards_payout_interval_ms: 86400000
        staking_withdrawals_payout_interval_ms: 30000
        staking_rewards_payout_batch_size: 50
        staking_default_rewards_share: 0.1
        pool_refill_limit_ms: 86400000
        max_bridge_leases_per_container: 10
        evm_transaction_submitters_bonus: 0.1
        container_removal_timeout: -1
        token_rate_update_interval_ms: 60000 # 60 seconds (approximately every other block)
        staking_oracle_pubkey: x"02CB22CF3F0EF7BD697D169797DDE3D2A974D626C6D99D5FEDAD5301E2E60E9227"
      economy_chain_test_claim_tchr:
        asset_name: "tCHR"
        asset_symbol: "tCHR"
        asset_decimals: 6
        amount_to_mint: 1000000000
        test_chr_refill_limit_millis: 604800000 # 1 week
        # corresponding private key for this test key is E9CF8BC054D6F853FA9457D95EDBCA76EF52CEAD2913674031513FB015F5B5C0
        account_creator_pubkey: x"02552192E2FA6F1C1229EB74FBDC9F27EEB87641BA11B29F9094D4F729C081AFA3"
      economy_chain_test_admin:
        # corresponding private key for this test key is E9CF8BC054D6F853FA9457D95EDBCA76EF52CEAD2913674031513FB015F5B5C0
        admin_pubkey: x"02552192E2FA6F1C1229EB74FBDC9F27EEB87641BA11B29F9094D4F729C081AFA3"
      economy_chain_test_mint_on_ras_staking:
        amount_to_mint: 1000000000
  token_chain:
    module: token_chain
    config:
      features:
        merkle_hash_version: 2
      gtx:
        modules:
          - "net.postchain.d1.icmf.IcmfSenderGTXModule"
          - "net.postchain.d1.icmf.IcmfReceiverGTXModule"
          - "net.postchain.d1.iccf.IccfGTXModule"
          - "net.postchain.eif.EifGTXModule"
      sync_ext:
        - "net.postchain.d1.icmf.IcmfReceiverSynchronizationInfrastructureExtension"
      icmf:
        receiver:
          directory-chain:
            topics:
              - L_provider_update # To sync system providers
              - L_provider_auth_update
          local:
            - topic: L_evm_block_events
              bc-rid: EIF_TC_EVENT_RECEIVER_BRID_PLACEHOLDER
      eif:
        snapshot:
          version: 2
    moduleArgs:
      token_chain:
        init_pubkey: x"02E0A8A3C79C9F18B7CEAD2493435AC926B4A527EF670B873F5F1410084EFF9C80" # Bob
        asset_name: "tCHR"
        asset_symbol: "tCHR"
        asset_decimals: 6
        asset_icon: "https://s3.eu-central-1.amazonaws.com/www.chromiadev.net/assets/tCHR.png"
        economy_chain_blockchain_rid: x"00"
        proposal_revoke_timeout_days: 1
      lib.hbridge.core:
        evm_read_offsets:
          "1337": 0
      lib.hbridge:
        version: 2 # multiple bridges
      lib.ft4.core.auth:
        evm_signatures_authorized_operations:
          - eif.hbridge.link_evm_eoa_account
      lib.ft4.core.accounts.strategies.transfer:
        rules:
          - sender_blockchain: "*"
            sender: "*"
            recipient: "*"
            asset:
              - name: "tCHR" # Should match `economy_chain_module_args.asset_name`
                min_amount: 1000000L # 1.0 tCHR
                issuing_blockchain_rid: x"00"
            timeout_days: 10
            strategy: "fee"
          - sender_blockchain: x"00"
            sender: "X"
            recipient: "X"
            asset:
              - name: "tCHR" # Should match `economy_chain_module_args.asset_name`
                min_amount: 1L # Smallest possible unit of tCHR should be OK
                issuing_blockchain_rid: x"00"
            timeout_days: 10
            strategy: "open"
      lib.ft4.core.accounts.strategies.transfer.fee:
        asset:
          - name: "tCHR"  # Should match `economy_chain_module_args.asset_name`
            amount: 10000000L # 10.0 tCHR
            issuing_blockchain_rid: x"00"

compile:
  rellVersion: 0.15.3
