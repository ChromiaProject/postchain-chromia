definitions:
  common.init: &common_init
    initial_provider: x"03ECD350EEBC617CBBFBEF0A1B7AE553A748021FD65C7C50C5ABB4CA16D4EA5B05"
    genesis_node:
      - x"0350fe40766bc0ce8d08b3f5b810e49a8352fdd458606bd5fafe5acdcdc8ff3f57"
      - node1
      - 9871
      - "http://node1:7740"
      - ""
  config: &common_config
    config_consensus_strategy: HEADER_HASH
    blockstrategy:
      maxblocktime: 2000
    revolt:
      fast_revolt_status_timeout: 2000
    signers:
      - x"0350fe40766bc0ce8d08b3f5b810e49a8352fdd458606bd5fafe5acdcdc8ff3f57"
    sync_ext:
      - "net.postchain.d1.icmf.IcmfReceiverSynchronizationInfrastructureExtension"
    gtx:
      modules:
        - "net.postchain.d1.icmf.IcmfSenderGTXModule"
        - "net.postchain.d1.icmf.IcmfReceiverGTXModule"
        - "net.postchain.eif.transaction.signerupdate.directorychain.SignerUpdateGTXModule"
    icmf:
      receiver:
        anchoring:
          topics:
            - G_configuration_updated
            - G_configuration_failed
            - G_last_anchored_heights

blockchains:
  manager:
    module: management_chain_directory1
    moduleArgs:
      common:
        allow_blockchain_dependencies: false
        provider_quota_max_actions_per_day: 100
      common.init: *common_init
      proposal_blockchain.util:
        max_config_path_depth: 10
        max_config_size: 2097152 # 2 MiB
        max_block_size: 27262976
        min_inter_block_interval: 1000
        min_fast_revolt_status_timeout: 2000
        allowed_dapp_chain_gtx_modules:
          - "net.postchain.rell.module.RellPostchainModuleFactory"
          - "net.postchain.gtx.StandardOpsGTXModule"
          - "net.postchain.d1.icmf.IcmfSenderGTXModule"
          - "net.postchain.d1.icmf.IcmfReceiverGTXModule"
          - "net.postchain.d1.iccf.IccfGTXModule"
          - "net.postchain.eif.EifGTXModule"
        allowed_dapp_chain_sync_exts:
          - "net.postchain.d1.icmf.IcmfReceiverSynchronizationInfrastructureExtension"
          - "net.postchain.eif.EifSynchronizationInfrastructureExtension"
    config:
      signers:
        - x"0350fe40766bc0ce8d08b3f5b810e49a8352fdd458606bd5fafe5acdcdc8ff3f57"
      config_consensus_strategy: HEADER_HASH
      fast_revolt_status_timeout: 1000
      blockstrategy:
        maxblocktime: 2000
      sync_ext:
        - net.postchain.d1.icmf.IcmfReceiverSynchronizationInfrastructureExtension
      gtx:
        modules:
          - "net.postchain.d1.icmf.IcmfReceiverGTXModule"
          - "net.postchain.d1.icmf.IcmfSenderGTXModule"
          - "net.postchain.eif.transaction.signerupdate.directorychain.SignerUpdateGTXModule"
      icmf:
        receiver:
          anchoring:
            topics:
              - G_configuration_updated
              - G_configuration_failed
              - G_last_anchored_heights
  system_anchoring:
    module: anchoring_chain_system
    config:
      config_consensus_strategy: HEADER_HASH
      blockstrategy:
        maxblocktime: 2000
        maxblocktransactions: 500
        name: "net.postchain.d1.anchoring.AnchoringBlockBuildingStrategy"
      sync_ext:
        - "net.postchain.d1.icmf.IcmfReceiverSynchronizationInfrastructureExtension"
      gtx:
        modules:
          - "net.postchain.d1.anchoring.system.SystemAnchoringGTXModule"
          - "net.postchain.d1.icmf.IcmfSenderGTXModule"
          - "net.postchain.d1.icmf.IcmfReceiverGTXModule"
      icmf:
        receiver:
          global:
            topics:
              - G_get_last_anchored_heights
  cluster_anchoring:
    module: anchoring_chain_cluster
    config:
      config_consensus_strategy: HEADER_HASH
      blockstrategy:
        maxblocktime: 2000
        maxblocktransactions: 500
        name: "net.postchain.d1.anchoring.AnchoringBlockBuildingStrategy"
      sync_ext:
        - "net.postchain.d1.icmf.IcmfReceiverSynchronizationInfrastructureExtension"
      gtx:
        modules:
          - "net.postchain.d1.anchoring.cluster.ClusterAnchoringGTXModule"
          - "net.postchain.d1.icmf.IcmfSenderGTXModule"
          - "net.postchain.d1.icmf.IcmfReceiverGTXModule"
      icmf:
        receiver:
          global:
            topics:
              - G_get_last_anchored_heights
  mainnet:
    module: management_chain_mainnet
    config:
      config_consensus_strategy: HEADER_HASH
      blockstrategy:
        maxblocktime: 2000
      revolt:
        fast_revolt_status_timeout: 1000
      signers:
        - x"0350fe40766bc0ce8d08b3f5b810e49a8352fdd458606bd5fafe5acdcdc8ff3f57"
      sync_ext:
        - "net.postchain.d1.icmf.IcmfReceiverSynchronizationInfrastructureExtension"
      gtx:
        modules:
          - "net.postchain.d1.icmf.IcmfSenderGTXModule"
          - "net.postchain.d1.icmf.IcmfReceiverGTXModule"
          - "net.postchain.eif.transaction.signerupdate.directorychain.SignerUpdateGTXModule"
      icmf:
        receiver:
          anchoring:
            topics:
              - G_configuration_updated
              - G_configuration_failed
              - G_last_anchored_heights
          global:
            topics:
              - G_create_cluster
              - G_create_container
              - G_upgrade_container
              - G_stop_container
              - G_restart_container
              - G_register_dapp_provider
              - G_change_dapp_providers_state
    moduleArgs:
      common:
        allow_blockchain_dependencies: false
        provider_quota_max_actions_per_day: 100
      common.init: *common_init
      proposal_blockchain.util:
        max_config_path_depth: 10
        max_config_size: 2097152 # 2 MiB
        max_block_size: 27262976
        min_inter_block_interval: 1000
        min_fast_revolt_status_timeout: 2000
        allowed_dapp_chain_gtx_modules:
          - "net.postchain.rell.module.RellPostchainModuleFactory"
          - "net.postchain.gtx.StandardOpsGTXModule"
          - "net.postchain.d1.icmf.IcmfSenderGTXModule"
          - "net.postchain.d1.icmf.IcmfReceiverGTXModule"
          - "net.postchain.d1.iccf.IccfGTXModule"
          - "net.postchain.eif.EifGTXModule"
        allowed_dapp_chain_sync_exts:
          - "net.postchain.d1.icmf.IcmfReceiverSynchronizationInfrastructureExtension"
          - "net.postchain.eif.EifSynchronizationInfrastructureExtension"
  economy_chain:
    module: economy_chain_test
    config:
      config_consensus_strategy: HEADER_HASH
      blockstrategy:
        maxblocktime: 2000
      revolt:
        fast_revolt_status_timeout: 2000
      sync_ext:
        - "net.postchain.d1.icmf.IcmfReceiverSynchronizationInfrastructureExtension"
      gtx:
        modules:
          - "net.postchain.d1.icmf.IcmfReceiverGTXModule"
          - "net.postchain.d1.icmf.IcmfSenderGTXModule"
          - "net.postchain.eif.EifGTXModule"
      icmf:
        receiver:
          anchoring:
            topics:
              - G_node_availability_report
          directory-chain:
            topics:
              - L_create_cluster_error
              - L_ticket_container_result
              - L_cluster_update
              - L_provider_update
              - L_node_update
              - L_cluster_node_update
          local:
            - topic: L_evm_block_events
              bc-rid: EIF_EC_EVENT_RECEIVER_BRID_PLACEHOLDER
      eif:
        snapshot:
          levels_per_page: 2
          snapshots_to_keep: 2
    moduleArgs:
      lib.ft4.core.admin:
        admin_pubkey: 0317AC5B309A05B81A68F1A64321A3C6E6799E037C12892838682EBB9A620316A6
      lib.ft4.core.accounts:
        rate_limit:
          active: 1
          max_points: 20
          recovery_time: 5000
          points_at_account_creation: 1
      lib.ft4.core.auth:
        evm_signatures_authorized_operations:
          - eif.hbridge.link_evm_eoa_account
      lib.ft4.core.accounts.strategies.transfer:
        rules:
          - sender_blockchain:
              - "EIF_EC_STRATEGY_SENDER_BLOCKCHAIN" # chr repl -c '("EVM",1,x"bridge_contract_address_without_0x").hash()' - token address from https://gitlab.com/chromaway/core/postchain-eif/-/blob/dev/postchain-eif-contracts/tasks/deployers/chromiabridge.ts?ref_type=heads#L21-L34
            sender: "*"
            recipient: "*"
            asset:
              - name: "Chromia" # Should match `economy_chain_module_args.asset_name`
                min_amount: 10000000L # 10.0 CHR
            timeout_days: 10
            strategy: "open"
          - sender_blockchain: "$"
            sender: "*"
            recipient: "*"
            asset:
              - name: "Chromia" # Should match `economy_chain_module_args.asset_name`
                min_amount: 10000000L # 10.0 CHR
            timeout_days: 10
            strategy: "fee"
      lib.ft4.core.accounts.strategies.transfer.fee:
        asset:
          - name: "Chromia"  # Should match `economy_chain_module_args.asset_name`
            amount: 10000000L # 10.0 CHR
        fee_account: x"A97CEAF65C5D7BE1B1307B0CD11AC9B3DB7065D24B8C1D36B135C68A846A4426" # pool account
      lib.auth:
        auth_pubkey: x"0317FF1ECF25B04026B6F9FA1960BA58070FB1CFC98519F7BC02D71ED1B00B1997"
      economy_chain:
        bsc_asset_network_id: 97
        bsc_asset_address: "B2ee8499B5e73795F28287A0603d66db6843a0f0"
        eth_asset_network_id: 11155111
        eth_asset_address: "Aa1ae68ABcd32804132370B9f73c3160dbbfC593"
        asset_name: "tCHR"
        asset_symbol: "tCHR"
        asset_decimals: 6
        asset_icon: "https://s3.eu-central-1.amazonaws.com/www.chromiadev.net/assets/tCHR.png"
        pool_amount_to_mint: 1000000000
        staking_withdrawal_delay_ms: 1209600000
        staking_delegation_delay_ms: 604800000
        staking_payout_interval_ms: 31536000000 # Good for testing
        staking_rewards_share: 0.1
        pool_refill_limit_ms: 86400000
        max_bridge_leases_per_container: 10
        evm_transaction_submitters_bonus: 0.1
      economy_chain_test_claim_tchr:
        asset_name: "tCHR"
        asset_symbol: "tCHR"
        asset_decimals: 6
        amount_to_mint: 1000000000
        test_chr_refill_limit_millis: 604800000 # 1 week
      economy_chain_test_admin:
        # corresponding private key for this test key is E9CF8BC054D6F853FA9457D95EDBCA76EF52CEAD2913674031513FB015F5B5C0
        admin_pubkey: x"02552192E2FA6F1C1229EB74FBDC9F27EEB87641BA11B29F9094D4F729C081AFA3"
      economy_chain_test_auth_server:
        # corresponding private key for this test key is E9CF8BC054D6F853FA9457D95EDBCA76EF52CEAD2913674031513FB015F5B5C0
        admin_pubkey: x"02552192E2FA6F1C1229EB74FBDC9F27EEB87641BA11B29F9094D4F729C081AFA3"
      economy_chain_test_mint_on_ras_staking:
        amount_to_mint: 1000000000

compile:
  rellVersion: 0.13.12
