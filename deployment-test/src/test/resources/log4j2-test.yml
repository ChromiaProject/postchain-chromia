Configuration:
  name: Default

  Properties:
    Property:
      - name: log.fork.id
        value: "${sys:forkId:-0}"

  Appenders:
    Console:
      - name: ConsoleAppender
        target: SYSTEM_OUT
        PatternLayout:
          pattern: "[${log.fork.id}] %d{yyyy-MM-dd HH:mm:ss.SSS} +++ %msg +++%n"

    File:
      - name: FileAppender
        fileName: "logs/test-${log.fork.id}.log"
        createOnDemand: true
        PatternLayout:
          pattern: "%d{yyyy-MM-dd HH:mm:ss.SSS} +++ %msg +++%n"
      - name: Deployment_Node1Appender
        fileName: "logs/deployment/node1-${log.fork.id}.log"
        createOnDemand: true
        PatternLayout:
          Pattern: "%msg%n"
      - name: Deployment_Node2Appender
        fileName: "logs/deployment/node2-${log.fork.id}.log"
        createOnDemand: true
        PatternLayout:
          pattern: "%msg%n"
      - name: Deployment_Node3Appender
        fileName: "logs/deployment/node3-${log.fork.id}.log"
        createOnDemand: true
        PatternLayout:
          pattern: "%msg%n"
      - name: Deployment_Node4Appender
