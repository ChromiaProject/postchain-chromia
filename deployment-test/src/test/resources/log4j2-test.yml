Configuration:
  name: Default

  Appenders:
    Console:
      - name: ConsoleAppender
        target: SYSTEM_OUT
        PatternLayout:
          pattern: "%d{yyyy-MM-dd HH:mm:ss.SSS} +++ %msg +++%n"

    File:
      - name: FileAppender
        fileName: "logs/test.log"
        PatternLayout:
          pattern: "%d{yyyy-MM-dd HH:mm:ss.SSS} +++ %msg +++%n"
      - name: Node1Appender
        fileName: "logs/node1.log"
        PatternLayout:
          Pattern: "%msg%n"
      - name: Node2Appender
        fileName: "logs/node2.log"
        PatternLayout:
          pattern: "%msg%n"
      - name: Node3Appender
        fileName: "logs/node3.log"
        PatternLayout:
          pattern: "%msg%n"

  Loggers:

    Root:
      level: info
      additivity: false
      AppenderRef:
        - ref: FileAppender

    Logger:
      - name: TestLogger
        level: info
        additivity: false
        AppenderRef:
          - ref: ConsoleAppender
          - ref: FileAppender
      - name: Node1Logger
        level: info
        additivity: false
        AppenderRef:
          - ref: Node1Appender
      - name: Node2Logger
        level: info
        additivity: false
        AppenderRef:
          - ref: Node2Appender
      - name: Node3Logger
        level: info
        additivity: false
        AppenderRef:
          - ref: Node3Appender
