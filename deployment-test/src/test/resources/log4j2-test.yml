Configuration:
  name: Default

  Appenders:
    Console:
      - name: ConsoleAppender
        target: SYSTEM_OUT
        PatternLayout:
          pattern: "%d{yyyy-MM-dd HH:mm:ss.SSS} +++ %msg +++%n"

    File:
      - name: FileAppender
        fileName: "logs/test.log"
        PatternLayout:
          pattern: "%d{yyyy-MM-dd HH:mm:ss.SSS} +++ %msg +++%n"
      - name: Deployment_Node1Appender
        fileName: "logs/deployment/node1.log"
        PatternLayout:
          Pattern: "%msg%n"
      - name: Deployment_Node2Appender
        fileName: "logs/deployment/node2.log"
        PatternLayout:
          pattern: "%msg%n"
      - name: Deployment_Node3Appender
        fileName: "logs/deployment/node3.log"
        PatternLayout:
          pattern: "%msg%n"
      - name: Deployment_Node4Appender
        fileName: "logs/deployment/node4.log"
        PatternLayout:
          pattern: "%msg%n"
      - name: Deployment_Node5Appender
        fileName: "logs/deployment/node5.log"
        PatternLayout:
          pattern: "%msg%n"
      - name: Reconfig_Node1Appender
        fileName: "logs/reconfig/node1.log"
        PatternLayout:
          Pattern: "%msg%n"
      - name: Reconfig_Node2Appender
        fileName: "logs/reconfig/node2.log"
        PatternLayout:
          pattern: "%msg%n"
      - name: Reconfig_Node3Appender
        fileName: "logs/reconfig/node3.log"
        PatternLayout:
          pattern: "%msg%n"
      - name: Moving_Node1Appender
        fileName: "logs/moving/node1.log"
        PatternLayout:
          Pattern: "%msg%n"
      - name: Moving_Node2Appender
        fileName: "logs/moving/node2.log"
        PatternLayout:
          pattern: "%msg%n"
      - name: Moving_Node3Appender
        fileName: "logs/moving/node3.log"
        PatternLayout:
          pattern: "%msg%n"
      - name: Archiving_Node1Appender
        fileName: "logs/archiving/node1.log"
        PatternLayout:
          Pattern: "%msg%n"
      - name: Archiving_Node2Appender
        fileName: "logs/archiving/node2.log"
        PatternLayout:
          pattern: "%msg%n"
      - name: Archiving_Node3Appender
        fileName: "logs/archiving/node3.log"
        PatternLayout:
          pattern: "%msg%n"
      - name: EC_EvmContainerAppender
        fileName: "logs/ec/evm_container.log"
        append: false
        PatternLayout:
          pattern: "%msg%n"
      - name: EC_Node1Appender
        fileName: "logs/ec/node1.log"
        append: false
        PatternLayout:
          pattern: "%msg%n"
      - name: EC_Node2Appender
        fileName: "logs/ec/node2.log"
        append: false
        PatternLayout:
          pattern: "%msg%n"
      - name: EC_Node3Appender
        fileName: "logs/ec/node3.log"
        append: false
        PatternLayout:
          pattern: "%msg%n"
      - name: EvmTxs_EvmContainerAppender
        fileName: "logs/evm_tx_submitter/evm_container.log"
        append: false
        PatternLayout:
          pattern: "%msg%n"
      - name: EvmTxs_Node1Appender
        fileName: "logs/evm_tx_submitter/node1.log"
        append: false
        PatternLayout:
          pattern: "%msg%n"
      - name: EvmTxs_Node2Appender
        fileName: "logs/evm_tx_submitter/node2.log"
        append: false
        PatternLayout:
          pattern: "%msg%n"
      - name: EvmTxs_Node3Appender
        fileName: "logs/evm_tx_submitter/node3.log"
        append: false
        PatternLayout:
          pattern: "%msg%n"
      - name: EvmTxs_Node4Appender
        fileName: "logs/evm_tx_submitter/node4.log"
        append: false
        PatternLayout:
          pattern: "%msg%n"
      - name: TC_EvmContainerAppender
        fileName: "logs/tc/evm_container.log"
        append: false
        PatternLayout:
          pattern: "%msg%n"
      - name: TC_Node1Appender
        fileName: "logs/tc/node1.log"
        append: false
        PatternLayout:
          pattern: "%msg%n"
      - name: TC_Node2Appender
        fileName: "logs/tc/node2.log"
        append: false
        PatternLayout:
          pattern: "%msg%n"
      - name: TC_Node3Appender
        fileName: "logs/tc/node3.log"
        append: false
        PatternLayout:
          pattern: "%msg%n"
  Loggers:

    Root:
      level: info
      additivity: false
      AppenderRef:
        - ref: FileAppender

    Logger:
      - name: TestLogger
        level: info
        additivity: false
        AppenderRef:
          - ref: ConsoleAppender
          - ref: FileAppender

      # Deployment tests
      - name: Deployment_Node1Logger
        level: info
        additivity: false
        AppenderRef:
          - ref: Deployment_Node1Appender
      - name: Deployment_Node2Logger
        level: info
        additivity: false
        AppenderRef:
          - ref: Deployment_Node2Appender
      - name: Deployment_Node3Logger
        level: info
        additivity: false
        AppenderRef:
          - ref: Deployment_Node3Appender
      - name: Deployment_Node4Logger
        level: info
        additivity: false
        AppenderRef:
          - ref: Deployment_Node4Appender
      - name: Deployment_Node5Logger
        level: info
        additivity: false
        AppenderRef:
