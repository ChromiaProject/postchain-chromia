Configuration:
  name: Default

  Appenders:
    Console:
      - name: ConsoleAppender
        target: SYSTEM_OUT
        PatternLayout:
          pattern: "%d{yyyy-MM-dd HH:mm:ss.SSS} +++ %msg +++%n"

    File:
      - name: FileAppender
        fileName: "logs/test.log"
        PatternLayout:
          pattern: "%d{yyyy-MM-dd HH:mm:ss.SSS} +++ %msg +++%n"
      - name: Deployment_Node1Appender
        fileName: "logs/deployment/node1.log"
        PatternLayout:
          Pattern: "%msg%n"
      - name: Deployment_Node2Appender
        fileName: "logs/deployment/node2.log"
        PatternLayout:
          pattern: "%msg%n"
      - name: Deployment_Node3Appender
        fileName: "logs/deployment/node3.log"
        PatternLayout:
          pattern: "%msg%n"
      - name: Reconfig_Node1Appender
        fileName: "logs/reconfig/node1.log"
        PatternLayout:
          Pattern: "%msg%n"
      - name: Reconfig_Node2Appender
        fileName: "logs/reconfig/node2.log"
        PatternLayout:
          pattern: "%msg%n"
      - name: Reconfig_Node3Appender
        fileName: "logs/reconfig/node3.log"
        PatternLayout:
          pattern: "%msg%n"
      - name: Moving_Node1Appender
        fileName: "logs/moving/node1.log"
        PatternLayout:
          Pattern: "%msg%n"
      - name: Moving_Node2Appender
        fileName: "logs/moving/node2.log"
        PatternLayout:
          pattern: "%msg%n"
      - name: Moving_Node3Appender
        fileName: "logs/moving/node3.log"
        PatternLayout:
          pattern: "%msg%n"
      - name: Archiving_Node1Appender
        fileName: "logs/archiving/node1.log"
        PatternLayout:
          Pattern: "%msg%n"
      - name: Archiving_Node2Appender
        fileName: "logs/archiving/node2.log"
        PatternLayout:
          pattern: "%msg%n"
      - name: Archiving_Node3Appender
        fileName: "logs/archiving/node3.log"
        PatternLayout:
          pattern: "%msg%n"
      - name: EC_Node1Appender
        fileName: "logs/ec/node1.log"
        PatternLayout:
          pattern: "%msg%n"
      - name: EC_Node2Appender
        fileName: "logs/ec/node2.log"
        PatternLayout:
          pattern: "%msg%n"
      - name: EC_Node3Appender
        fileName: "logs/ec/node3.log"
        PatternLayout:
          pattern: "%msg%n"

  Loggers:

    Root:
      level: info
      additivity: false
      AppenderRef:
        - ref: FileAppender

    Logger:
      - name: TestLogger
        level: info
        additivity: false
        AppenderRef:
          - ref: ConsoleAppender
          - ref: FileAppender

      # Deployment tests
      - name: Deployment_Node1Logger
        level: info
        additivity: false
        AppenderRef:
          - ref: Deployment_Node1Appender
      - name: Deployment_Node2Logger
        level: info
        additivity: false
        AppenderRef:
          - ref: Deployment_Node2Appender
      - name: Deployment_Node3Logger
        level: info
        additivity: false
        AppenderRef:
          - ref: Deployment_Node3Appender

      # Reconfiguration tests
      - name: Reconfig_Node1Logger
        level: info
        additivity: false
        AppenderRef:
          - ref: Reconfig_Node1Appender
      - name: Reconfig_Node2Logger
        level: info
        additivity: false
        AppenderRef:
          - ref: Reconfig_Node2Appender
      - name: Reconfig_Node3Logger
        level: info
        additivity: false
        AppenderRef:
          - ref: Reconfig_Node3Appender

      # Moving tests
      - name: Moving_Node1Logger
        level: info
        additivity: false
        AppenderRef:
          - ref: Moving_Node1Appender
      - name: Moving_Node2Logger
        level: info
        additivity: false
        AppenderRef:
          - ref: Moving_Node2Appender
      - name: Moving_Node3Logger
        level: info
        additivity: false
        AppenderRef:
          - ref: Moving_Node3Appender

      # Archiving/Unarchiving tests
      - name: Archiving_Node1Logger
        level: info
        additivity: false
        AppenderRef:
          - ref: Archiving_Node1Appender
      - name: Archiving_Node2Logger
        level: info
        additivity: false
        AppenderRef:
          - ref: Archiving_Node2Appender
      - name: Archiving_Node3Logger
        level: info
        additivity: false
        AppenderRef:
          - ref: Archiving_Node3Appender

      # EC tests
      - name: EC_Node1Logger
        level: info
        additivity: false
        AppenderRef:
          - ref: EC_Node1Appender
      - name: EC_Node2Logger
        level: info
        additivity: false
        AppenderRef:
          - ref: EC_Node2Appender
      - name: EC_Node3Logger
        level: info
        additivity: false
        AppenderRef:
          - ref: EC_Node3Appender
