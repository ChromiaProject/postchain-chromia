      - name: EvmTxs_Node1Logger
        level: info
        additivity: false
        AppenderRef:
          - ref: EvmTxs_Node1Appender
      - name: EvmTxs_Node2Logger
        level: info
        additivity: false
        AppenderRef:
          - ref: EvmTxs_Node2Appender
      - name: EvmTxs_Node3Logger
        level: info
