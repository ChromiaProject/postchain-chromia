Configuration:
  name: Default

  Appenders:
    Console:
      - name: ConsoleAppender
        target: SYSTEM_OUT
        PatternLayout:
          pattern: "%d{yyyy-MM-dd HH:mm:ss.SSS} +++ %msg +++%n"

    File:
      - name: FileAppender
        fileName: "logs/test.log"
        PatternLayout:
          pattern: "%d{yyyy-MM-dd HH:mm:ss.SSS} +++ %msg +++%n"
      - name: Deployment_Node1Appender
        fileName: "logs/deployment/node1.log"
        PatternLayout:
          Pattern: "%msg%n"
      - name: Deployment_Node2Appender
        fileName: "logs/deployment/node2.log"
        PatternLayout:
          pattern: "%msg%n"
      - name: Deployment_Node3Appender
        fileName: "logs/deployment/node3.log"
        PatternLayout:
          pattern: "%msg%n"
      - name: Reconfig_Node1Appender
        fileName: "logs/reconfig/node1.log"
        PatternLayout:
          Pattern: "%msg%n"
      - name: Reconfig_Node2Appender
        fileName: "logs/reconfig/node2.log"
        PatternLayout:
          pattern: "%msg%n"
      - name: Reconfig_Node3Appender
        fileName: "logs/reconfig/node3.log"
        PatternLayout:
          pattern: "%msg%n"

  Loggers:

    Root:
      level: info
      additivity: false
      AppenderRef:
        - ref: FileAppender

    Logger:
      - name: TestLogger
        level: info
        additivity: false
        AppenderRef:
          - ref: ConsoleAppender
          - ref: FileAppender

      - name: Deployment_Node1Logger
        level: info
        additivity: false
        AppenderRef:
          - ref: Deployment_Node1Appender
      - name: Deployment_Node2Logger
        level: info
        additivity: false
        AppenderRef:
          - ref: Deployment_Node2Appender
      - name: Deployment_Node3Logger
        level: info
        additivity: false
        AppenderRef:
          - ref: Deployment_Node3Appender

      - name: Reconfig_Node1Logger
        level: info
        additivity: false
        AppenderRef:
          - ref: Reconfig_Node1Appender
      - name: Reconfig_Node2Logger
        level: info
        additivity: false
        AppenderRef:
          - ref: Reconfig_Node2Appender
      - name: Reconfig_Node3Logger
        level: info
        additivity: false
        AppenderRef:
          - ref: Reconfig_Node3Appender

