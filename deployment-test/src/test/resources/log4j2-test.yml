          - ref: Moving_Node2Appender
      - name: Moving_Node3Logger
        level: info
        additivity: false
        AppenderRef:
          - ref: Moving_Node3Appender

      # Archiving/Unarchiving tests
      - name: Archiving_Node1Logger
        level: info
        additivity: false
        AppenderRef:
          - ref: Archiving_Node1Appender
      - name: Archiving_Node2Logger
        level: info
        additivity: false
        AppenderRef:
          - ref: Archiving_Node2Appender
      - name: Archiving_Node3Logger
        level: info
        additivity: false
        AppenderRef:
          - ref: Archiving_Node3Appender

      # EC tests
      - name: EC_EvmContainerLogger
        level: info
        additivity: false
        AppenderRef:
          - ref: EC_EvmContainerAppender
      - name: EC_Node1Logger
        level: info
